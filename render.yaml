# One-click deploy on Render (https://render.com):
#   New → Blueprint → pick this GitHub repo → Apply.
# Gives you: https://<name>.onrender.com serving the app + a managed Postgres.
#
# Free-tier notes (fine for demos, not for the pilot):
# - The web service sleeps after idle; first request takes ~30s to wake.
# - Disk is ephemeral: uploaded files/audit reports vanish on redeploy
#   (the database survives). The pilot moves storage to S3 (SCALE.md D6)
#   and the service to a paid plan.

services:
  - type: web
    name: interlock
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: interlock-db
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true   # secrets.py auto-upgrades to Fernet with this set
      - key: STORAGE_DIR
        value: /app/data

databases:
  - name: interlock-db
    plan: free
