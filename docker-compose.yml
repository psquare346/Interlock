services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interlock
      POSTGRES_PASSWORD: interlock   # local dev only; production uses the secret backend
      POSTGRES_DB: interlock
    ports:
      # 55432 on the host: many dev machines already run a native Postgres on 5432.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interlock"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://interlock:interlock@db:5432/interlock
      STORAGE_DIR: /app/data
    ports:
      - "8080:8080"
    volumes:
      - appdata:/app/data

volumes:
  pgdata:
  appdata:
